apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: opensearch

spec:
  serviceName: opensearch-headless
  replicas: 3

  # Allow all three nodes to start during initial cluster formation.
  podManagementPolicy: Parallel

  selector:
    matchLabels:
      app: opensearch

  template:
    metadata:
      labels:
        app: opensearch

    spec:
      securityContext:
        fsGroup: 1000

      # OpenSearch requires vm.max_map_count >= 262144.
      initContainers:
        - name: set-vm-max-map-count
          image: busybox:1.36
          command:
            - sysctl
            - -w
            - vm.max_map_count=262144
          securityContext:
            privileged: true

      containers:
        - name: opensearch
          image: opensearchproject/opensearch:3.8.0

          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name

            - name: cluster.name
              value: cloud-observability

            - name: node.name
              value: $(POD_NAME)

            - name: network.host
              value: "0.0.0.0"

            - name: discovery.seed_hosts
              value: >-
                opensearch-0.opensearch-headless,
                opensearch-1.opensearch-headless,
                opensearch-2.opensearch-headless

            - name: cluster.initial_cluster_manager_nodes
              value: opensearch-0,opensearch-1,opensearch-2

            - name: OPENSEARCH_JAVA_OPTS
              value: "-Xms512m -Xmx512m"

            - name: OPENSEARCH_INITIAL_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: opensearch-bootstrap
                  key: OPENSEARCH_INITIAL_ADMIN_PASSWORD

            - name: plugins.security.ssl.http.enabled
              value: "true"

            - name: plugins.security.ssl.http.pemcert_filepath
              value: certs/tls.crt

            - name: plugins.security.ssl.http.pemkey_filepath
              value: certs/tls.key

            - name: plugins.security.ssl.http.pemtrustedcas_filepath
              value: certs/ca.crt

          ports:
            - name: http
              containerPort: 9200

            - name: transport
              containerPort: 9300

            - name: performance
              containerPort: 9600

          volumeMounts:
            - name: data
              mountPath: /usr/share/opensearch/data

            - name: tls
              mountPath: /usr/share/opensearch/config/certs
              readOnly: true

          resources:
            requests:
              cpu: 300m
              memory: 1Gi
            limits:
              cpu: "1"
              memory: 1536Mi

          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 20
            periodSeconds: 10

      volumes:
      - name: tls
        secret:
          secretName: opensearch-tls

      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: opensearch

  volumeClaimTemplates:
    - metadata:
        name: data

      spec:
        accessModes:
          - ReadWriteOnce

        # storageClassName intentionally omitted.
        # Base uses the cluster default StorageClass.
        # Environment overlays may replace it.

        resources:
          requests:
            storage: 10Gi
