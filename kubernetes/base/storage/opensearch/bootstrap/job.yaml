apiVersion: batch/v1
kind: Job
metadata:
  name: opensearch-bootstrap

spec:
  backoffLimit: 10

  template:
    metadata:
      labels:
        app: opensearch-bootstrap

    spec:
      restartPolicy: OnFailure

      containers:
        - name: bootstrap
          image: curlimages/curl:8.12.1

          env:
            - name: ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: opensearch-bootstrap
                  key: OPENSEARCH_INITIAL_ADMIN_PASSWORD

            - name: INGEST_USERNAME
              valueFrom:
                secretKeyRef:
                  name: opensearch-ingest
                  key: username

            - name: INGEST_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: opensearch-ingest
                  key: password

          command:
            - /bin/sh
            - -ec
            - |
              echo "Waiting for OpenSearch..."

              MAX_ATTEMPTS=60
              ATTEMPT=1

              until curl -kfsS \
                --connect-timeout 3 \
                --max-time 5 \
                -u "admin:${ADMIN_PASSWORD}" \
                https://opensearch:9200/_cluster/health \
                >/dev/null;
              do
                if [ "$ATTEMPT" -ge "$MAX_ATTEMPTS" ]; then
                  echo "OpenSearch did not become ready in time."
                  exit 1
                fi

                echo "OpenSearch not ready yet (${ATTEMPT}/${MAX_ATTEMPTS})..."
                ATTEMPT=$((ATTEMPT + 1))
                sleep 5
              done

              echo "Creating ingest role..."

              curl -kfsS \
                --connect-timeout 3 \
                --max-time 10 \
                -u "admin:${ADMIN_PASSWORD}" \
                -H 'Content-Type: application/json' \
                -X PUT \
                https://opensearch:9200/_plugins/_security/api/roles/otel-ingest-role \
                -d '{
                  "cluster_permissions": [
                    "cluster_composite_ops"
                  ],
                  "index_permissions": [
                    {
                      "index_patterns": [
                        "otel-logs*"
                      ],
                      "allowed_actions": [
                        "create_index",
                        "write"
                      ]
                    }
                  ],
                  "tenant_permissions": []
                }'

              ESCAPED_INGEST_PASSWORD=$(
                printf '%s' "$INGEST_PASSWORD" |
                  sed 's/\\/\\\\/g; s/"/\\"/g'
              )

              echo "Creating ingest user..."

              curl -kfsS \
                --connect-timeout 3 \
                --max-time 10 \
                -u "admin:${ADMIN_PASSWORD}" \
                -H 'Content-Type: application/json' \
                -X PUT \
                "https://opensearch:9200/_plugins/_security/api/internalusers/${INGEST_USERNAME}" \
                -d "{
                  \"password\": \"${ESCAPED_INGEST_PASSWORD}\",
                  \"opendistro_security_roles\": [
                    \"otel-ingest-role\"
                  ]
                }"

              echo "Verifying ingest role..."

              curl -kfsS \
                --connect-timeout 3 \
                --max-time 10 \
                -u "admin:${ADMIN_PASSWORD}" \
                "https://opensearch:9200/_plugins/_security/api/roles/otel-ingest-role" \
                >/dev/null

              echo "Verifying ingest user..."

              curl -kfsS \
                --connect-timeout 3 \
                --max-time 10 \
                -u "admin:${ADMIN_PASSWORD}" \
                "https://opensearch:9200/_plugins/_security/api/internalusers/${INGEST_USERNAME}" \
                >/dev/null

              echo "OpenSearch bootstrap complete."
