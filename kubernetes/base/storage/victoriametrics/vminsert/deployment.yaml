apiVersion: apps/v1
kind: Deployment
metadata:
  name: vminsert

spec:
  replicas: 2

  selector:
    matchLabels:
      app: vminsert

  template:
    metadata:
      labels:
        app: vminsert

    spec:
      containers:
        - name: vminsert
          image: victoriametrics/vminsert:v1.150.0-cluster

          args:
            - -storageNode=vmstorage-0.vmstorage:8400
            - -storageNode=vmstorage-1.vmstorage:8400

          ports:
            - name: http
              containerPort: 8480

          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 384Mi

      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: vminsert
