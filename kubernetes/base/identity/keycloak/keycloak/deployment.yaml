apiVersion: apps/v1
kind: Deployment
metadata:
  name: keycloak

spec:
  replicas: 1

  selector:
    matchLabels:
      app: keycloak

  template:
    metadata:
      labels:
        app: keycloak

    spec:
      # Start Keycloak only once its database answers: no CrashLoopBackOff
      # on a fresh install while the Postgres volume is being provisioned.
      initContainers:
        - name: wait-for-db
          image: postgres:17-alpine
          command:
            - /bin/sh
            - -ec
            - |
              until pg_isready -q -h keycloak-postgres -p 5432; do
                echo "waiting for keycloak-postgres..."
                sleep 2
              done

      containers:
        - name: keycloak
          image: quay.io/keycloak/keycloak:26.7.3

          args:
            - start

          env:
            - name: KC_DB
              value: postgres

            - name: KC_DB_NAME
              valueFrom:
                secretKeyRef:
                  name: keycloak-db
                  key: database

            - name: KC_DB_URL
              value: jdbc:postgresql://keycloak-postgres:5432/$(KC_DB_NAME)

            - name: KC_DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: keycloak-db
                  key: username

            - name: KC_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: keycloak-db
                  key: password

            - name: KC_BOOTSTRAP_ADMIN_USERNAME
              valueFrom:
                secretKeyRef:
                  name: keycloak-admin
                  key: username

            - name: KC_BOOTSTRAP_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: keycloak-admin
                  key: password

            - name: KC_HEALTH_ENABLED
              value: "true"

            - name: KC_METRICS_ENABLED
              value: "true"

          ports:
            - name: http
              containerPort: 8080

            - name: management
              containerPort: 9000

          startupProbe:
            httpGet:
              path: /health/started
              port: management
            periodSeconds: 10
            failureThreshold: 30

          readinessProbe:
            httpGet:
              path: /health/ready
              port: management
            periodSeconds: 10

          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
