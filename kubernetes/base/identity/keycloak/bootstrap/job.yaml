apiVersion: batch/v1
kind: Job
metadata:
  name: keycloak-bootstrap

spec:
  backoffLimit: 10
  activeDeadlineSeconds: 900

  template:
    metadata:
      labels:
        app: keycloak-bootstrap

    spec:
      restartPolicy: OnFailure

      containers:
        - name: bootstrap
          image: quay.io/keycloak/keycloak:26.7.3

          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi

          env:
            - name: KEYCLOAK_ADMIN_USERNAME
              valueFrom:
                secretKeyRef:
                  name: keycloak-admin
                  key: username

            - name: KEYCLOAK_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: keycloak-admin
                  key: password

            - name: GRAFANA_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: grafana-oidc
                  key: client_id

            - name: GRAFANA_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: grafana-oidc
                  key: client_secret

          command:
            - /bin/sh
            - -ec
            - |
              KCADM=/opt/keycloak/bin/kcadm.sh
              SERVER=http://keycloak:8080
              REALM=observability

              echo "Waiting for Keycloak..."

              until $KCADM config credentials \
                --server "$SERVER" \
                --realm master \
                --user "$KEYCLOAK_ADMIN_USERNAME" \
                --password "$KEYCLOAK_ADMIN_PASSWORD";
              do
                sleep 5
              done


              # ========================================
              # Realm
              # ========================================

              if ! $KCADM get "realms/$REALM" >/dev/null 2>&1; then
                echo "Creating realm: $REALM"

                $KCADM create realms \
                  -s realm="$REALM" \
                  -s enabled=true
              fi


              # ========================================
              # Realm roles
              # ========================================

              for ROLE in platform-admin tenant-admin viewer; do
                if ! $KCADM get "roles/$ROLE" \
                  -r "$REALM" >/dev/null 2>&1;
                then
                  echo "Creating role: $ROLE"

                  $KCADM create roles \
                    -r "$REALM" \
                    -s name="$ROLE"
                fi
              done


              # ========================================
              # Grafana OIDC client
              # ========================================

              echo "Ensuring Grafana OIDC client..."

              GRAFANA_CLIENT_UUID=$(
                $KCADM get clients \
                  -r "$REALM" \
                  -q clientId="$GRAFANA_CLIENT_ID" \
                  --fields id \
                  --format csv \
                  --noquotes
              )

              if [ -z "$GRAFANA_CLIENT_UUID" ]; then
                echo "Creating Grafana OIDC client..."

                $KCADM create clients \
                  -r "$REALM" \
                  -s "clientId=$GRAFANA_CLIENT_ID" \
                  -s enabled=true \
                  -s protocol=openid-connect \
                  -s publicClient=false \
                  -s clientAuthenticatorType=client-secret \
                  -s "secret=$GRAFANA_CLIENT_SECRET" \
                  -s standardFlowEnabled=true \
                  -s directAccessGrantsEnabled=false \
                  -s serviceAccountsEnabled=false \
                  -s 'redirectUris=["http://localhost:3000/login/generic_oauth","http://127.0.0.1:3000/login/generic_oauth"]'

                GRAFANA_CLIENT_UUID=$(
                  $KCADM get clients \
                    -r "$REALM" \
                    -q clientId="$GRAFANA_CLIENT_ID" \
                    --fields id \
                    --format csv \
                    --noquotes
                )

              else
                echo "Updating Grafana OIDC client..."

                $KCADM update "clients/$GRAFANA_CLIENT_UUID" \
                  -r "$REALM" \
                  -s enabled=true \
                  -s protocol=openid-connect \
                  -s publicClient=false \
                  -s clientAuthenticatorType=client-secret \
                  -s "secret=$GRAFANA_CLIENT_SECRET" \
                  -s standardFlowEnabled=true \
                  -s directAccessGrantsEnabled=false \
                  -s serviceAccountsEnabled=false \
                  -s 'redirectUris=["http://localhost:3000/login/generic_oauth","http://127.0.0.1:3000/login/generic_oauth"]'
              fi

              echo "Grafana OIDC client ready."


              # ========================================
              # Query Gateway OIDC client
              # ========================================

              echo "Ensuring Query Gateway OIDC client..."

              QUERY_GATEWAY_CLIENT_ID=query-gateway

              QUERY_GATEWAY_CLIENT_UUID=$(
                $KCADM get clients \
                  -r "$REALM" \
                  -q clientId="$QUERY_GATEWAY_CLIENT_ID" \
                  --fields id \
                  --format csv \
                  --noquotes
              )

              if [ -z "$QUERY_GATEWAY_CLIENT_UUID" ]; then
                echo "Creating Query Gateway OIDC client..."

                $KCADM create clients \
                  -r "$REALM" \
                  -s "clientId=$QUERY_GATEWAY_CLIENT_ID" \
                  -s enabled=true \
                  -s protocol=openid-connect \
                  -s bearerOnly=true \
                  -s publicClient=false \
                  -s standardFlowEnabled=false \
                  -s directAccessGrantsEnabled=false \
                  -s serviceAccountsEnabled=false

              else
                echo "Updating Query Gateway OIDC client..."

                $KCADM update "clients/$QUERY_GATEWAY_CLIENT_UUID" \
                  -r "$REALM" \
                  -s enabled=true \
                  -s protocol=openid-connect \
                  -s bearerOnly=true \
                  -s publicClient=false \
                  -s standardFlowEnabled=false \
                  -s directAccessGrantsEnabled=false \
                  -s serviceAccountsEnabled=false
              fi

              echo "Query Gateway OIDC client ready."

              # ========================================
              # OTel Gateway OIDC client
              # ========================================

              echo "Ensuring OTel Gateway OIDC client..."

              OTEL_GATEWAY_CLIENT_ID=otel-gateway

              OTEL_GATEWAY_CLIENT_UUID=$(
                $KCADM get clients \
                  -r "$REALM" \
                  -q clientId="$OTEL_GATEWAY_CLIENT_ID" \
                  --fields id \
                  --format csv \
                  --noquotes
              )

              if [ -z "$OTEL_GATEWAY_CLIENT_UUID" ]; then
                echo "Creating OTel Gateway OIDC client..."

                $KCADM create clients \
                  -r "$REALM" \
                  -s "clientId=$OTEL_GATEWAY_CLIENT_ID" \
                  -s enabled=true \
                  -s protocol=openid-connect \
                  -s bearerOnly=true \
                  -s publicClient=false \
                  -s standardFlowEnabled=false \
                  -s directAccessGrantsEnabled=false \
                  -s serviceAccountsEnabled=false

              else
                echo "Updating OTel Gateway OIDC client..."

                $KCADM update "clients/$OTEL_GATEWAY_CLIENT_UUID" \
                  -r "$REALM" \
                  -s enabled=true \
                  -s protocol=openid-connect \
                  -s bearerOnly=true \
                  -s publicClient=false \
                  -s standardFlowEnabled=false \
                  -s directAccessGrantsEnabled=false \
                  -s serviceAccountsEnabled=false
              fi

              echo "OTel Gateway OIDC client ready."

              # ========================================
              # Query Gateway audience mapper
              # ========================================

              echo "Ensuring Query Gateway audience mapper..."

              AUDIENCE_MAPPER_NAME=query-gateway-audience

              AUDIENCE_MAPPER_ID=$(
                $KCADM get \
                  "clients/$GRAFANA_CLIENT_UUID/protocol-mappers/models" \
                  -r "$REALM" \
                  --fields id,name \
                  --format csv \
                  --noquotes |
                while IFS=, read -r ID NAME; do
                  if [ "$NAME" = "$AUDIENCE_MAPPER_NAME" ]; then
                    printf '%s\n' "$ID"
                    break
                  fi
                done
              )

              AUDIENCE_MAPPER_JSON=$(
                printf '%s' \
                  "{\"name\":\"$AUDIENCE_MAPPER_NAME\",\"protocol\":\"openid-connect\",\"protocolMapper\":\"oidc-audience-mapper\",\"consentRequired\":false,\"config\":{\"included.client.audience\":\"query-gateway\",\"id.token.claim\":\"false\",\"access.token.claim\":\"true\",\"introspection.token.claim\":\"true\"}}"
              )

              if [ -z "$AUDIENCE_MAPPER_ID" ]; then
                echo "Creating Query Gateway audience mapper..."

                printf '%s\n' "$AUDIENCE_MAPPER_JSON" |
                  $KCADM create \
                    "clients/$GRAFANA_CLIENT_UUID/protocol-mappers/models" \
                    -r "$REALM" \
                    -f -

              else
                echo "Updating Query Gateway audience mapper..."

                AUDIENCE_MAPPER_UPDATE_JSON=$(
                  printf '%s' \
                    "{\"id\":\"$AUDIENCE_MAPPER_ID\",\"name\":\"$AUDIENCE_MAPPER_NAME\",\"protocol\":\"openid-connect\",\"protocolMapper\":\"oidc-audience-mapper\",\"consentRequired\":false,\"config\":{\"included.client.audience\":\"query-gateway\",\"id.token.claim\":\"false\",\"access.token.claim\":\"true\",\"introspection.token.claim\":\"true\"}}"
                )

                printf '%s\n' "$AUDIENCE_MAPPER_UPDATE_JSON" |
                  $KCADM update \
                    "clients/$GRAFANA_CLIENT_UUID/protocol-mappers/models/$AUDIENCE_MAPPER_ID" \
                    -r "$REALM" \
                    -f -
              fi

              echo "Query Gateway audience mapper ready."


              # ========================================
              # Tenant groups mapper
              # ========================================

              echo "Ensuring tenant groups mapper..."

              GROUPS_MAPPER_NAME=tenant-groups

              GROUPS_MAPPER_ID=$(
                $KCADM get \
                  "clients/$GRAFANA_CLIENT_UUID/protocol-mappers/models" \
                  -r "$REALM" \
                  --fields id,name \
                  --format csv \
                  --noquotes |
                while IFS=, read -r ID NAME; do
                  if [ "$NAME" = "$GROUPS_MAPPER_NAME" ]; then
                    printf '%s\n' "$ID"
                    break
                  fi
                done
              )

              GROUPS_MAPPER_JSON=$(
                printf '%s' \
                  "{\"name\":\"$GROUPS_MAPPER_NAME\",\"protocol\":\"openid-connect\",\"protocolMapper\":\"oidc-group-membership-mapper\",\"consentRequired\":false,\"config\":{\"claim.name\":\"groups\",\"full.path\":\"false\",\"id.token.claim\":\"false\",\"access.token.claim\":\"true\",\"userinfo.token.claim\":\"false\",\"introspection.token.claim\":\"true\"}}"
              )

              if [ -z "$GROUPS_MAPPER_ID" ]; then
                echo "Creating tenant groups mapper..."

                printf '%s\n' "$GROUPS_MAPPER_JSON" |
                  $KCADM create \
                    "clients/$GRAFANA_CLIENT_UUID/protocol-mappers/models" \
                    -r "$REALM" \
                    -f -

              else
                echo "Updating tenant groups mapper..."

                GROUPS_MAPPER_UPDATE_JSON=$(
                  printf '%s' \
                    "{\"id\":\"$GROUPS_MAPPER_ID\",\"name\":\"$GROUPS_MAPPER_NAME\",\"protocol\":\"openid-connect\",\"protocolMapper\":\"oidc-group-membership-mapper\",\"consentRequired\":false,\"config\":{\"claim.name\":\"groups\",\"full.path\":\"false\",\"id.token.claim\":\"false\",\"access.token.claim\":\"true\",\"userinfo.token.claim\":\"false\",\"introspection.token.claim\":\"true\"}}"
                )

                printf '%s\n' "$GROUPS_MAPPER_UPDATE_JSON" |
                  $KCADM update \
                    "clients/$GRAFANA_CLIENT_UUID/protocol-mappers/models/$GROUPS_MAPPER_ID" \
                    -r "$REALM" \
                    -f -
              fi

              echo "Tenant groups mapper ready."


              # ========================================
              # VictoriaMetrics account ID mapper
              # ========================================

              echo "Ensuring VictoriaMetrics account ID mapper..."

              VM_ACCOUNT_MAPPER_NAME=vm-account-id

              VM_ACCOUNT_MAPPER_ID=$(
                $KCADM get \
                  "clients/$GRAFANA_CLIENT_UUID/protocol-mappers/models" \
                  -r "$REALM" \
                  --fields id,name \
                  --format csv \
                  --noquotes |
                while IFS=, read -r ID NAME; do
                  if [ "$NAME" = "$VM_ACCOUNT_MAPPER_NAME" ]; then
                    printf '%s\n' "$ID"
                    break
                  fi
                done
              )

              VM_ACCOUNT_MAPPER_JSON=$(
                printf '%s' \
                  "{\"name\":\"$VM_ACCOUNT_MAPPER_NAME\",\"protocol\":\"openid-connect\",\"protocolMapper\":\"oidc-usermodel-attribute-mapper\",\"consentRequired\":false,\"config\":{\"user.attribute\":\"vm_account_id\",\"claim.name\":\"vm_account_id\",\"jsonType.label\":\"String\",\"multivalued\":\"true\",\"aggregate.attrs\":\"true\",\"id.token.claim\":\"true\",\"access.token.claim\":\"true\",\"userinfo.token.claim\":\"true\",\"introspection.token.claim\":\"true\"}}"
              )

              if [ -z "$VM_ACCOUNT_MAPPER_ID" ]; then
                echo "Creating VictoriaMetrics account ID mapper..."

                printf '%s\n' "$VM_ACCOUNT_MAPPER_JSON" |
                  $KCADM create \
                    "clients/$GRAFANA_CLIENT_UUID/protocol-mappers/models" \
                    -r "$REALM" \
                    -f -

              else
                echo "Updating VictoriaMetrics account ID mapper..."

                VM_ACCOUNT_MAPPER_UPDATE_JSON=$(
                  printf '%s' \
                    "{\"id\":\"$VM_ACCOUNT_MAPPER_ID\",\"name\":\"$VM_ACCOUNT_MAPPER_NAME\",\"protocol\":\"openid-connect\",\"protocolMapper\":\"oidc-usermodel-attribute-mapper\",\"consentRequired\":false,\"config\":{\"user.attribute\":\"vm_account_id\",\"claim.name\":\"vm_account_id\",\"jsonType.label\":\"String\",\"multivalued\":\"true\",\"aggregate.attrs\":\"true\",\"id.token.claim\":\"true\",\"access.token.claim\":\"true\",\"userinfo.token.claim\":\"true\",\"introspection.token.claim\":\"true\"}}"
                )

                printf '%s\n' "$VM_ACCOUNT_MAPPER_UPDATE_JSON" |
                  $KCADM update \
                    "clients/$GRAFANA_CLIENT_UUID/protocol-mappers/models/$VM_ACCOUNT_MAPPER_ID" \
                    -r "$REALM" \
                    -f -
              fi

              echo "VictoriaMetrics account ID mapper ready."

              # ========================================
              # VictoriaMetrics tenant account IDs
              # ========================================

              echo "Ensuring VictoriaMetrics account IDs for tenant groups..."

              GROUP_ROWS=$(
                $KCADM get groups \
                  -r "$REALM" \
                  --fields id,name \
                  --format csv \
                  --noquotes
              )

              USED_VM_ACCOUNT_IDS=""

              while IFS=, read -r GROUP_ID GROUP_NAME; do
                [ -n "$GROUP_ID" ] || continue

                GROUP_JSON=$(
                  $KCADM get "groups/$GROUP_ID" \
                    -r "$REALM"
                )

                VM_ACCOUNT_ID=$(
                  printf '%s' "$GROUP_JSON" |
                    sed -n \
                      's/.*"vm_account_id"[[:space:]]*:[[:space:]]*\[[[:space:]]*"\([^"]*\)".*/\1/p'
                )

                if [ -n "$VM_ACCOUNT_ID" ]; then
                  USED_VM_ACCOUNT_IDS="$USED_VM_ACCOUNT_IDS $VM_ACCOUNT_ID"
                fi
              done <<EOF
              $GROUP_ROWS
              EOF


              NEXT_VM_ACCOUNT_ID=1

              while :; do
                FOUND=false

                for USED_ID in $USED_VM_ACCOUNT_IDS; do
                  if [ "$USED_ID" = "$NEXT_VM_ACCOUNT_ID" ]; then
                    FOUND=true
                    break
                  fi
                done

                if [ "$FOUND" = false ]; then
                  break
                fi

                NEXT_VM_ACCOUNT_ID=$((NEXT_VM_ACCOUNT_ID + 1))
              done


              while IFS=, read -r GROUP_ID GROUP_NAME; do
                [ -n "$GROUP_ID" ] || continue

                GROUP_JSON=$(
                  $KCADM get "groups/$GROUP_ID" \
                    -r "$REALM"
                )

                VM_ACCOUNT_ID=$(
                  printf '%s' "$GROUP_JSON" |
                    sed -n \
                      's/.*"vm_account_id"[[:space:]]*:[[:space:]]*\[[[:space:]]*"\([^"]*\)".*/\1/p'
                )

                if [ -n "$VM_ACCOUNT_ID" ]; then
                  echo \
                    "Tenant group $GROUP_NAME already has vm_account_id=$VM_ACCOUNT_ID"

                  continue
                fi

                while :; do
                  FOUND=false

                  for USED_ID in $USED_VM_ACCOUNT_IDS; do
                    if [ "$USED_ID" = "$NEXT_VM_ACCOUNT_ID" ]; then
                      FOUND=true
                      break
                    fi
                  done

                  if [ "$FOUND" = false ]; then
                    break
                  fi

                  NEXT_VM_ACCOUNT_ID=$((NEXT_VM_ACCOUNT_ID + 1))
                done

                echo \
                  "Assigning vm_account_id=$NEXT_VM_ACCOUNT_ID to tenant group $GROUP_NAME"

                $KCADM update "groups/$GROUP_ID" \
                  -r "$REALM" \
                  -s "attributes.vm_account_id=[\"$NEXT_VM_ACCOUNT_ID\"]"

                USED_VM_ACCOUNT_IDS="$USED_VM_ACCOUNT_IDS $NEXT_VM_ACCOUNT_ID"

                NEXT_VM_ACCOUNT_ID=$((NEXT_VM_ACCOUNT_ID + 1))
              done <<EOF
              $GROUP_ROWS
              EOF

              echo "VictoriaMetrics account IDs ready."

              # ========================================
              # Control Plane Admin client
              # ========================================

              echo "Ensuring Control Plane Admin client..."

              CONTROL_PLANE_CLIENT_ID=control-plane-admin

              CONTROL_PLANE_CLIENT_UUID=$(
                $KCADM get clients \
                  -r "$REALM" \
                  -q clientId="$CONTROL_PLANE_CLIENT_ID" \
                  --fields id \
                  --format csv \
                  --noquotes
              )

              if [ -z "$CONTROL_PLANE_CLIENT_UUID" ]; then
                echo "Creating Control Plane Admin client..."

                $KCADM create clients \
                  -r "$REALM" \
                  -s "clientId=$CONTROL_PLANE_CLIENT_ID" \
                  -s enabled=true \
                  -s protocol=openid-connect \
                  -s publicClient=false \
                  -s clientAuthenticatorType=client-secret \
                  -s standardFlowEnabled=false \
                  -s directAccessGrantsEnabled=false \
                  -s serviceAccountsEnabled=true

                CONTROL_PLANE_CLIENT_UUID=$(
                  $KCADM get clients \
                    -r "$REALM" \
                    -q clientId="$CONTROL_PLANE_CLIENT_ID" \
                    --fields id \
                    --format csv \
                    --noquotes
                )

              else
                echo "Updating Control Plane Admin client..."

                $KCADM update "clients/$CONTROL_PLANE_CLIENT_UUID" \
                  -r "$REALM" \
                  -s enabled=true \
                  -s protocol=openid-connect \
                  -s publicClient=false \
                  -s clientAuthenticatorType=client-secret \
                  -s standardFlowEnabled=false \
                  -s directAccessGrantsEnabled=false \
                  -s serviceAccountsEnabled=true
              fi

              echo "Assigning Control Plane Admin permissions..."

              SERVICE_ACCOUNT_USERNAME="service-account-$CONTROL_PLANE_CLIENT_ID"

              $KCADM add-roles \
                -r "$REALM" \
                --uusername "$SERVICE_ACCOUNT_USERNAME" \
                --cclientid realm-management \
                --rolename manage-clients

              $KCADM add-roles \
                -r "$REALM" \
                --uusername "$SERVICE_ACCOUNT_USERNAME" \
                --cclientid realm-management \
                --rolename manage-users

              echo "Control Plane Admin client ready."

              # ========================================
              # Done
              # ========================================

              echo "Keycloak bootstrap complete."
