apiVersion: batch/v1
kind: Job
metadata:
  name: keycloak-bootstrap

spec:
  backoffLimit: 10
  activeDeadlineSeconds: 900

  template:
    metadata:
      labels:
        app: keycloak-bootstrap

    spec:
      restartPolicy: OnFailure

      containers:
        - name: bootstrap
          image: quay.io/keycloak/keycloak:26.7.3

          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi

          env:
            - name: KEYCLOAK_ADMIN_USERNAME
              valueFrom:
                secretKeyRef:
                  name: keycloak-admin
                  key: username

            - name: KEYCLOAK_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: keycloak-admin
                  key: password

            - name: GRAFANA_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: grafana-oidc
                  key: client_id

            - name: GRAFANA_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: grafana-oidc
                  key: client_secret

          command:
            - /bin/sh
            - -ec
            - |
              KCADM=/opt/keycloak/bin/kcadm.sh
              SERVER=http://keycloak:8080
              REALM=observability

              echo "Waiting for Keycloak..."

              until $KCADM config credentials \
                --server "$SERVER" \
                --realm master \
                --user "$KEYCLOAK_ADMIN_USERNAME" \
                --password "$KEYCLOAK_ADMIN_PASSWORD";
              do
                sleep 5
              done

              if ! $KCADM get "realms/$REALM" >/dev/null 2>&1; then
                echo "Creating realm: $REALM"

                $KCADM create realms \
                  -s realm="$REALM" \
                  -s enabled=true
              fi

              for ROLE in platform-admin tenant-admin viewer; do
                if ! $KCADM get "roles/$ROLE" \
                  -r "$REALM" >/dev/null 2>&1;
                then
                  echo "Creating role: $ROLE"

                  $KCADM create roles \
                    -r "$REALM" \
                    -s name="$ROLE"
                fi
              done

              echo "Ensuring Grafana OIDC client..."

              GRAFANA_CLIENT_UUID=$(
                $KCADM get clients \
                  -r "$REALM" \
                  -q clientId="$GRAFANA_CLIENT_ID" \
                  --fields id \
                  --format csv \
                  --noquotes
              )

              if [ -z "$GRAFANA_CLIENT_UUID" ]; then
                echo "Creating Grafana OIDC client..."

                $KCADM create clients \
                  -r "$REALM" \
                  -s "clientId=$GRAFANA_CLIENT_ID" \
                  -s enabled=true \
                  -s protocol=openid-connect \
                  -s publicClient=false \
                  -s clientAuthenticatorType=client-secret \
                  -s "secret=$GRAFANA_CLIENT_SECRET" \
                  -s standardFlowEnabled=true \
                  -s directAccessGrantsEnabled=false \
                  -s serviceAccountsEnabled=false \
                  -s 'redirectUris=["http://localhost:3000/login/generic_oauth","http://127.0.0.1:3000/login/generic_oauth"]'

                  GRAFANA_CLIENT_UUID=$(
                    $KCADM get clients \
                        -r "$REALM" \
                        -q clientId="$GRAFANA_CLIENT_ID" \
                        --fields id \
                        --format csv \
                        --noquotes
                    )

              else
                echo "Updating Grafana OIDC client..."

                $KCADM update "clients/$GRAFANA_CLIENT_UUID" \
                  -r "$REALM" \
                  -s enabled=true \
                  -s protocol=openid-connect \
                  -s publicClient=false \
                  -s clientAuthenticatorType=client-secret \
                  -s "secret=$GRAFANA_CLIENT_SECRET" \
                  -s standardFlowEnabled=true \
                  -s directAccessGrantsEnabled=false \
                  -s serviceAccountsEnabled=false \
                  -s 'redirectUris=["http://localhost:3000/login/generic_oauth","http://127.0.0.1:3000/login/generic_oauth"]'
              fi

              echo "Grafana OIDC client ready."

              echo "Ensuring Query Gateway OIDC client..."

              QUERY_GATEWAY_CLIENT_ID=query-gateway

              QUERY_GATEWAY_CLIENT_UUID=$(
                $KCADM get clients \
                  -r "$REALM" \
                  -q clientId="$QUERY_GATEWAY_CLIENT_ID" \
                  --fields id \
                  --format csv \
                  --noquotes
              )

              if [ -z "$QUERY_GATEWAY_CLIENT_UUID" ]; then
                echo "Creating Query Gateway OIDC client..."

                $KCADM create clients \
                  -r "$REALM" \
                  -s "clientId=$QUERY_GATEWAY_CLIENT_ID" \
                  -s enabled=true \
                  -s protocol=openid-connect \
                  -s bearerOnly=true \
                  -s publicClient=false \
                  -s standardFlowEnabled=false \
                  -s directAccessGrantsEnabled=false \
                  -s serviceAccountsEnabled=false

              else
                echo "Updating Query Gateway OIDC client..."

                $KCADM update "clients/$QUERY_GATEWAY_CLIENT_UUID" \
                  -r "$REALM" \
                  -s enabled=true \
                  -s protocol=openid-connect \
                  -s bearerOnly=true \
                  -s publicClient=false \
                  -s standardFlowEnabled=false \
                  -s directAccessGrantsEnabled=false \
                  -s serviceAccountsEnabled=false
              fi

              echo "Query Gateway OIDC client ready."

              echo "Ensuring Query Gateway audience mapper..."

              AUDIENCE_MAPPER_NAME=query-gateway-audience

              AUDIENCE_MAPPER_ID=$(
                $KCADM get \
                  "clients/$GRAFANA_CLIENT_UUID/protocol-mappers/models" \
                  -r "$REALM" \
                  --fields id,name \
                  --format csv \
                  --noquotes |
                while IFS=, read -r ID NAME; do
                  if [ "$NAME" = "$AUDIENCE_MAPPER_NAME" ]; then
                    printf '%s\n' "$ID"
                    break
                  fi
                done
              )

              AUDIENCE_MAPPER_JSON=$(
                printf '%s' \
                  "{\"name\":\"$AUDIENCE_MAPPER_NAME\",\"protocol\":\"openid-connect\",\"protocolMapper\":\"oidc-audience-mapper\",\"consentRequired\":false,\"config\":{\"included.client.audience\":\"query-gateway\",\"id.token.claim\":\"false\",\"access.token.claim\":\"true\",\"introspection.token.claim\":\"true\"}}"
              )

              if [ -z "$AUDIENCE_MAPPER_ID" ]; then
                echo "Creating Query Gateway audience mapper..."

                printf '%s\n' "$AUDIENCE_MAPPER_JSON" |
                  $KCADM create \
                    "clients/$GRAFANA_CLIENT_UUID/protocol-mappers/models" \
                    -r "$REALM" \
                    -f -

              else
                echo "Updating Query Gateway audience mapper..."

                printf '%s\n' "$AUDIENCE_MAPPER_JSON" |
                  $KCADM update \
                    "clients/$GRAFANA_CLIENT_UUID/protocol-mappers/models/$AUDIENCE_MAPPER_ID" \
                    -r "$REALM" \
                    -f -
              fi

              echo "Query Gateway audience mapper ready."

              echo "Ensuring tenant groups mapper..."

              GROUPS_MAPPER_NAME=tenant-groups

              GROUPS_MAPPER_ID=$(
                $KCADM get \
                  "clients/$GRAFANA_CLIENT_UUID/protocol-mappers/models" \
                  -r "$REALM" \
                  --fields id,name \
                  --format csv \
                  --noquotes |
                while IFS=, read -r ID NAME; do
                  if [ "$NAME" = "$GROUPS_MAPPER_NAME" ]; then
                    printf '%s\n' "$ID"
                    break
                  fi
                done
              )

              GROUPS_MAPPER_JSON=$(
                printf '%s' \
                  "{\"name\":\"$GROUPS_MAPPER_NAME\",\"protocol\":\"openid-connect\",\"protocolMapper\":\"oidc-group-membership-mapper\",\"consentRequired\":false,\"config\":{\"claim.name\":\"groups\",\"full.path\":\"false\",\"id.token.claim\":\"false\",\"access.token.claim\":\"true\",\"userinfo.token.claim\":\"false\",\"introspection.token.claim\":\"true\"}}"
              )

              if [ -z "$GROUPS_MAPPER_ID" ]; then
                echo "Creating tenant groups mapper..."

                printf '%s\n' "$GROUPS_MAPPER_JSON" |
                  $KCADM create \
                    "clients/$GRAFANA_CLIENT_UUID/protocol-mappers/models" \
                    -r "$REALM" \
                    -f -

              else
                echo "Updating tenant groups mapper..."

                printf '%s\n' "$GROUPS_MAPPER_JSON" |
                  $KCADM update \
                    "clients/$GRAFANA_CLIENT_UUID/protocol-mappers/models/$GROUPS_MAPPER_ID" \
                    -r "$REALM" \
                    -f -
              fi

              echo "Tenant groups mapper ready."

              echo "Keycloak bootstrap complete."