receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318
        auth:
          authenticator: oidc/agent

processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 400
    spike_limit_mib: 100

  resource/tenant:
    attributes:
      - key: tenant.id
        from_context: auth.claims.tenant_id
        action: upsert

      - key: agent.id
        from_context: auth.claims.agent_id
        action: upsert

      - key: vm.account.id
        from_context: auth.claims.vm_account_id
        action: upsert

  batch:

extensions:
  basicauth/opensearch:
    client_auth:
      username: ${env:OPENSEARCH_USERNAME}
      password: ${env:OPENSEARCH_PASSWORD}

  oidc/agent:
    providers:
      - issuer_url: http://localhost:8080/realms/observability
        audience: otel-gateway
        public_keys_file: /etc/otel/jwks/jwks.json

exporters:
  prometheusremotewrite/victoriametrics:
    endpoint: http://vminsert:8480/insert/0/prometheus/api/v1/write

  opensearch:
    http:
      endpoint: https://opensearch:9200
      auth:
        authenticator: basicauth/opensearch
      tls:
        insecure_skip_verify: true

    logs_index: otel-logs

service:
  extensions:
    - basicauth/opensearch
    - oidc/agent

  pipelines:
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [prometheusremotewrite/victoriametrics]

    logs:
      receivers: [otlp]
      processors: [memory_limiter, resource/tenant, batch]
      exporters: [opensearch]
