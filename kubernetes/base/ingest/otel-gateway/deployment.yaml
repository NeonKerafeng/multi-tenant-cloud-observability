apiVersion: apps/v1
kind: Deployment
metadata:
  name: otel-gateway

spec:
  replicas: 2

  selector:
    matchLabels:
      app: otel-gateway

  template:
    metadata:
      labels:
        app: otel-gateway

    spec:
      containers:
        - name: otel-gateway
          image: otel/opentelemetry-collector-contrib:0.160.0

          args:
            - --config=/etc/otelcol-contrib/config.yaml

          env:
            - name: OPENSEARCH_USERNAME
              valueFrom:
                secretKeyRef:
                  name: opensearch-ingest
                  key: username

            - name: OPENSEARCH_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: opensearch-ingest
                  key: password

          ports:
            - name: otlp-http
              containerPort: 4318

          volumeMounts:
            - name: config
              mountPath: /etc/otelcol-contrib/config.yaml
              subPath: config.yaml
              readOnly: true

          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi

      volumes:
        - name: config
          configMap:
            name: otel-gateway-config

      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: otel-gateway
