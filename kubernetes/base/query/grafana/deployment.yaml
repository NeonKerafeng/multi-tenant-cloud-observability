apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana

spec:
  replicas: 1

  strategy:
    type: Recreate

  selector:
    matchLabels:
      app: grafana

  template:
    metadata:
      labels:
        app: grafana

    spec:
      securityContext:
        fsGroup: 472

      containers:
        - name: grafana
          image: grafana/grafana:13.2.1

          env:
            # Grafana local admin
            - name: GF_SECURITY_ADMIN_USER
              valueFrom:
                secretKeyRef:
                  name: grafana-admin
                  key: username

            - name: GF_SECURITY_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: grafana-admin
                  key: password


            # OAuth basic config
            - name: GF_AUTH_GENERIC_OAUTH_ENABLED
              value: "true"

            - name: GF_AUTH_GENERIC_OAUTH_NAME
              value: Keycloak

            # Only users pre-provisioned by control-plane may sign in.
            - name: GF_AUTH_GENERIC_OAUTH_ALLOW_SIGN_UP
              value: "false"


            # Grafana OIDC client identity
            - name: GF_AUTH_GENERIC_OAUTH_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: grafana-oidc
                  key: client_id

            - name: GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: grafana-oidc
                  key: client_secret

            - name: GF_AUTH_GENERIC_OAUTH_SCOPES
              value: "openid profile email"


            # Keycloak OIDC endpoints
            - name: GF_AUTH_GENERIC_OAUTH_AUTH_URL
              value: http://localhost:8080/realms/observability/protocol/openid-connect/auth

            - name: GF_AUTH_GENERIC_OAUTH_TOKEN_URL
              value: http://keycloak:8080/realms/observability/protocol/openid-connect/token

            - name: GF_AUTH_GENERIC_OAUTH_API_URL
              value: http://keycloak:8080/realms/observability/protocol/openid-connect/userinfo


            # Grafana public URL
            - name: GF_SERVER_ROOT_URL
              value: http://localhost:3000


            # Keycloak role -> Grafana role
            - name: GF_AUTH_GENERIC_OAUTH_ROLE_ATTRIBUTE_PATH
              value: "contains(realm_access.roles[*], 'platform-admin') && 'Admin' || contains(realm_access.roles[*], 'tenant-admin') && 'Editor' || contains(realm_access.roles[*], 'viewer') && 'Viewer' || 'None'"

            # ------------------------------------------------------------
            # One org per tenant, managed ONLY by control-plane (TODO-02).
            # control-plane pre-creates every Grafana user and sets its org
            # memberships/roles through the API; nobody edits them by hand.
            # ------------------------------------------------------------

            # Login does not touch org memberships or roles.
            - name: GF_AUTH_GENERIC_OAUTH_SKIP_ORG_ROLE_SYNC
              value: "true"

            # Match the Keycloak login to the pre-provisioned user by email
            # (Grafana otherwise only matches by IdP user id). Safe because
            # there is a single IdP, emails are unique and verified, and
            # users cannot edit their email (keycloak-bootstrap removes
            # self-service account management).
            - name: GF_AUTH_OAUTH_ALLOW_INSECURE_EMAIL_LOOKUP
              value: "true"

            # Keep Grafana login == Keycloak username (not the email).
            - name: GF_AUTH_GENERIC_OAUTH_LOGIN_ATTRIBUTE_PATH
              value: preferred_username

            # No human local login: the internal admin is API-only
            # (used by control-plane).
            - name: GF_AUTH_DISABLE_LOGIN_FORM
              value: "true"

            - name: GF_USERS_ALLOW_ORG_CREATE
              value: "false"

            - name: GF_AUTH_GENERIC_OAUTH_ROLE_ATTRIBUTE_STRICT
              value: "true"

            # Datasource plugins
            - name: GF_PLUGINS_PREINSTALL
              value: "grafana-opensearch-datasource@2.34.4"

            - name: GF_AUTH_GENERIC_OAUTH_USE_REFRESH_TOKEN
              value: "true"

          ports:
            - name: http
              containerPort: 3000

          volumeMounts:
            - name: data
              mountPath: /var/lib/grafana

            - name: datasource-provisioning
              mountPath: /etc/grafana/provisioning/datasources
              readOnly: true

          startupProbe:
            httpGet:
              path: /api/health
              port: http
            periodSeconds: 5
            failureThreshold: 36

          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10

          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20

          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi

      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: grafana-data
        - name: datasource-provisioning
          configMap:
            name: grafana-datasources