apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana

spec:
  replicas: 1

  strategy:
    type: Recreate

  selector:
    matchLabels:
      app: grafana

  template:
    metadata:
      labels:
        app: grafana

    spec:
      securityContext:
        fsGroup: 472

      containers:
        - name: grafana
          image: grafana/grafana:13.2.1

          env:
            - name: GF_SECURITY_ADMIN_USER
              valueFrom:
                secretKeyRef:
                  name: grafana-admin
                  key: username

            - name: GF_SECURITY_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: grafana-admin
                  key: password

            - name: GF_AUTH_GENERIC_OAUTH_ENABLED
              value: "true"

            - name: GF_AUTH_GENERIC_OAUTH_NAME
              value: Keycloak

            - name: GF_AUTH_GENERIC_OAUTH_ALLOW_SIGN_UP
              value: "true"

            - name: GF_AUTH_GENERIC_OAUTH_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: grafana-oidc
                  key: client_id

            - name: GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: grafana-oidc
                  key: client_secret

            - name: GF_AUTH_GENERIC_OAUTH_SCOPES
              value: "openid profile email"

            - name: GF_AUTH_GENERIC_OAUTH_AUTH_URL
              value: http://localhost:8080/realms/observability/protocol/openid-connect/auth

            - name: GF_AUTH_GENERIC_OAUTH_TOKEN_URL
              value: http://keycloak:8080/realms/observability/protocol/openid-connect/token

            - name: GF_AUTH_GENERIC_OAUTH_API_URL
              value: http://keycloak:8080/realms/observability/protocol/openid-connect/userinfo

            - name: GF_SERVER_ROOT_URL
              value: http://localhost:3000

            - name: GF_AUTH_GENERIC_OAUTH_ROLE_ATTRIBUTE_PATH
              value: "contains(realm_access.roles[*], 'platform-admin') && 'Admin' || contains(realm_access.roles[*], 'tenant-admin') && 'Editor' || contains(realm_access.roles[*], 'viewer') && 'Viewer' || 'None'"

            - name: GF_AUTH_GENERIC_OAUTH_ROLE_ATTRIBUTE_STRICT
              value: "true"

          ports:
            - name: http
              containerPort: 3000

          volumeMounts:
            - name: data
              mountPath: /var/lib/grafana

          startupProbe:
            httpGet:
              path: /api/health
              port: http
            periodSeconds: 5
            failureThreshold: 36

          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10

          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20

          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi

      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: grafana-data
