apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana

spec:
  # HA (TODO-02 step 7): replicas are stateless, state lives in
  # grafana-postgres; sessions are stored in the DB so any replica serves
  # any user.
  replicas: 2

  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1

  selector:
    matchLabels:
      app: grafana

  template:
    metadata:
      labels:
        app: grafana

    spec:
      securityContext:
        fsGroup: 472

      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: grafana

      initContainers:
        - name: wait-for-db
          image: postgres:17-alpine
          command:
            - /bin/sh
            - -ec
            - |
              until pg_isready -h grafana-postgres -p 5432; do
                echo "waiting for grafana-postgres..."
                sleep 2
              done

      containers:
        - name: grafana
          image: grafana/grafana:13.2.1

          env:
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP

            - name: GOMEMLIMIT
              value: "900MiB"

            # ------------------------------------------------------------
            # Shared state in Postgres (TODO-02 step 7).
            # ------------------------------------------------------------
            - name: GF_DATABASE_TYPE
              value: postgres

            - name: GF_DATABASE_HOST
              value: grafana-postgres:5432

            - name: GF_DATABASE_NAME
              valueFrom:
                secretKeyRef:
                  name: grafana-db
                  key: database

            - name: GF_DATABASE_USER
              valueFrom:
                secretKeyRef:
                  name: grafana-db
                  key: username

            - name: GF_DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: grafana-db
                  key: password

            - name: GF_DATABASE_SSL_MODE
              value: disable

            # Must be identical on every replica (encrypts datasource
            # secrets in the DB). Never change it once data exists.
            - name: GF_SECURITY_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: grafana-db
                  key: secret_key

            # Unified alerting HA: replicas gossip so each alert is
            # evaluated and notified once.
            - name: GF_UNIFIED_ALERTING_HA_PEERS
              value: grafana-alerting:9094

            - name: GF_UNIFIED_ALERTING_HA_LISTEN_ADDRESS
              value: "$(POD_IP):9094"

            - name: GF_UNIFIED_ALERTING_HA_ADVERTISE_ADDRESS
              value: "$(POD_IP):9094"

            # Grafana local admin
            - name: GF_SECURITY_ADMIN_USER
              valueFrom:
                secretKeyRef:
                  name: grafana-admin
                  key: username

            - name: GF_SECURITY_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: grafana-admin
                  key: password


            # OAuth basic config
            - name: GF_AUTH_GENERIC_OAUTH_ENABLED
              value: "true"

            - name: GF_AUTH_GENERIC_OAUTH_NAME
              value: Keycloak

            # Only users pre-provisioned by control-plane may sign in.
            - name: GF_AUTH_GENERIC_OAUTH_ALLOW_SIGN_UP
              value: "false"


            # Grafana OIDC client identity
            - name: GF_AUTH_GENERIC_OAUTH_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: grafana-oidc
                  key: client_id

            - name: GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: grafana-oidc
                  key: client_secret

            - name: GF_AUTH_GENERIC_OAUTH_SCOPES
              value: "openid profile email"


            # Keycloak OIDC endpoints
            - name: GF_AUTH_GENERIC_OAUTH_AUTH_URL
              value: http://localhost:8080/realms/observability/protocol/openid-connect/auth

            - name: GF_AUTH_GENERIC_OAUTH_TOKEN_URL
              value: http://keycloak:8080/realms/observability/protocol/openid-connect/token

            - name: GF_AUTH_GENERIC_OAUTH_API_URL
              value: http://keycloak:8080/realms/observability/protocol/openid-connect/userinfo


            # Grafana public URL
            - name: GF_SERVER_ROOT_URL
              value: http://localhost:3000


            # Keycloak role -> Grafana role
            - name: GF_AUTH_GENERIC_OAUTH_ROLE_ATTRIBUTE_PATH
              value: "contains(realm_access.roles[*], 'platform-admin') && 'Admin' || contains(realm_access.roles[*], 'tenant-admin') && 'Editor' || contains(realm_access.roles[*], 'viewer') && 'Viewer' || 'None'"

            # ------------------------------------------------------------
            # One org per tenant, managed ONLY by control-plane (TODO-02).
            # control-plane pre-creates every Grafana user and sets its org
            # memberships/roles through the API; nobody edits them by hand.
            # ------------------------------------------------------------

            # Login does not touch org memberships or roles.
            - name: GF_AUTH_GENERIC_OAUTH_SKIP_ORG_ROLE_SYNC
              value: "true"

            # Match the Keycloak login to the pre-provisioned user by email
            # (Grafana otherwise only matches by IdP user id). Safe because
            # there is a single IdP, emails are unique and verified, and
            # users cannot edit their email (keycloak-bootstrap removes
            # self-service account management).
            - name: GF_AUTH_OAUTH_ALLOW_INSECURE_EMAIL_LOOKUP
              value: "true"

            # Keep Grafana login == Keycloak username (not the email).
            - name: GF_AUTH_GENERIC_OAUTH_LOGIN_ATTRIBUTE_PATH
              value: preferred_username

            # No human local login: the internal admin is API-only
            # (used by control-plane).
            - name: GF_AUTH_DISABLE_LOGIN_FORM
              value: "true"

            - name: GF_USERS_ALLOW_ORG_CREATE
              value: "false"

            - name: GF_AUTH_GENERIC_OAUTH_ROLE_ATTRIBUTE_STRICT
              value: "true"

            # Datasource plugins
            - name: GF_PLUGINS_PREINSTALL
              value: "grafana-opensearch-datasource@2.34.4"

            - name: GF_AUTH_GENERIC_OAUTH_USE_REFRESH_TOKEN
              value: "true"

          ports:
            - name: http
              containerPort: 3000

            - name: gossip-tcp
              containerPort: 9094
              protocol: TCP

            - name: gossip-udp
              containerPort: 9094
              protocol: UDP

          volumeMounts:
            - name: data
              mountPath: /var/lib/grafana

            - name: datasource-provisioning
              mountPath: /etc/grafana/provisioning/datasources
              readOnly: true

          startupProbe:
            httpGet:
              path: /api/health
              port: http
            periodSeconds: 5
            failureThreshold: 36

          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10

          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20

          # 512Mi was OOMKilled (2026-10-09) with alerting HA, live and the
          # OpenSearch plugin loaded. GOMEMLIMIT makes the Go GC work harder
          # before the container limit is reached.
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              cpu: 500m
              memory: 1Gi

      volumes:
        # Plugins/cache only: all durable state is in grafana-postgres.
        - name: data
          emptyDir: {}
        - name: datasource-provisioning
          configMap:
            name: grafana-datasources