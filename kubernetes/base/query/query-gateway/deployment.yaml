apiVersion: apps/v1
kind: Deployment
metadata:
  name: query-gateway

spec:
  replicas: 2

  selector:
    matchLabels:
      app: query-gateway

  template:
    metadata:
      labels:
        app: query-gateway

    spec:
      containers:
        - name: query-gateway

          # Replaced by development/production overlay.
          image: query-gateway:latest

          ports:
            - name: http
              containerPort: 8080

          env:
            - name: PORT
              value: "8080"

            - name: VICTORIAMETRICS_URL
              value: http://vmselect:8481

            - name: OPENSEARCH_URL
              value: https://opensearch:9200

            # Add our project CA to Node.js trusted CAs.
            - name: NODE_EXTRA_CA_CERTS
              value: /etc/observability/ca/ca.crt

            # Query Gateway service identity for OpenSearch.
            - name: OPENSEARCH_USERNAME
              valueFrom:
                secretKeyRef:
                  name: opensearch-query
                  key: username

            - name: OPENSEARCH_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: opensearch-query
                  key: password

            - name: KEYCLOAK_ISSUER
              value: http://localhost:8080/realms/observability

            - name: KEYCLOAK_JWKS_URI
              value: http://keycloak:8080/realms/observability/protocol/openid-connect/certs

            - name: KEYCLOAK_AUDIENCE
              value: query-gateway

            - name: TENANT_BACKENDS_JSON
              valueFrom:
                configMapKeyRef:
                  name: tenant-backends
                  key: tenants.json

          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10

          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20

          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi

          volumeMounts:
            - name: opensearch-ca
              mountPath: /etc/observability/ca
              readOnly: true

      volumes:
        - name: opensearch-ca
          secret:
            secretName: opensearch-tls
            items:
              - key: ca.crt
                path: ca.crt

      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: query-gateway