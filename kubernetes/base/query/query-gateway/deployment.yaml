apiVersion: apps/v1
kind: Deployment
metadata:
  name: query-gateway

spec:
  replicas: 2

  selector:
    matchLabels:
      app: query-gateway

  template:
    metadata:
      labels:
        app: query-gateway

    spec:
      containers:
        - name: query-gateway

          # Must be replaced by an image reachable from the Kubernetes cluster.
          image: query-gateway:latest

          ports:
            - name: http
              containerPort: 8080

          env:
            - name: PORT
              value: "8080"

            - name: VICTORIAMETRICS_URL
              value: http://vmselect:8481

            - name: OPENSEARCH_URL
              value: https://opensearch:9200

            - name: OPENSEARCH_CA_FILE
              value: /etc/observability/ca/ca.crt

            - name: OPENSEARCH_CLIENT_CERT_FILE
              value: /etc/observability/client-tls/tls.crt

            - name: OPENSEARCH_CLIENT_KEY_FILE
              value: /etc/observability/client-tls/tls.key

          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10

          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20

          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi

          volumeMounts:
          - name: opensearch-ca
            mountPath: /etc/observability/ca
            readOnly: true

          - name: query-gateway-client-tls
            mountPath: /etc/observability/client-tls
            readOnly: true

      volumes:
        - name: opensearch-ca
          secret:
            secretName: opensearch-tls
            items:
              - key: ca.crt
                path: ca.crt

        - name: query-gateway-client-tls
          secret:
            secretName: query-gateway-tls
            items:
              - key: tls.crt
                path: tls.crt
              - key: tls.key
                path: tls.key

      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: query-gateway
