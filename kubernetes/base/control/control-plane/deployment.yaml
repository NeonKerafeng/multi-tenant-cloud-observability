apiVersion: apps/v1
kind: Deployment
metadata:
  name: control-plane

spec:
  replicas: 1

  selector:
    matchLabels:
      app: control-plane

  template:
    metadata:
      labels:
        app: control-plane

    spec:
      containers:
        - name: control-plane

          # Replaced by development/production overlay.
          image: control-plane:latest

          ports:
            - name: http
              containerPort: 8080

          # Ready only once Nest listens (after the outbox worker started),
          # so a rollout replaces the old pod only after the new one is up.
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5

          env:
            - name: PORT
              value: "8080"

            # Human JWT verification.
            - name: KEYCLOAK_ISSUER
              value: http://localhost:8080/realms/observability

            - name: KEYCLOAK_JWKS_URI
              value: http://keycloak:8080/realms/observability/protocol/openid-connect/certs

            - name: KEYCLOAK_AUDIENCE
              value: control-plane

            # Control Plane -> Keycloak Admin API.
            - name: KEYCLOAK_URL
              value: http://keycloak:8080

            - name: KEYCLOAK_REALM
              value: observability

            - name: KEYCLOAK_ADMIN_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: control-plane-keycloak
                  key: client_id

            - name: KEYCLOAK_ADMIN_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: control-plane-keycloak
                  key: client_secret

            - name: KEYCLOAK_PUBLIC_URL
              valueFrom:
                configMapKeyRef:
                  name: platform-endpoints
                  key: KEYCLOAK_PUBLIC_URL

            - name: OTEL_GATEWAY_PUBLIC_URL
              valueFrom:
                configMapKeyRef:
                  name: platform-endpoints
                  key: OTEL_GATEWAY_PUBLIC_URL

            # Control Plane -> Grafana HTTP API (one org per tenant).
            - name: GRAFANA_URL
              value: http://grafana:3000

            - name: GRAFANA_ADMIN_USER
              valueFrom:
                secretKeyRef:
                  name: grafana-admin
                  key: username

            - name: GRAFANA_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: grafana-admin
                  key: password

            # Tenant that owns Grafana org 1 (platform admins live here).
            - name: GRAFANA_DEFAULT_TENANT
              value: admin-tenant

            # Datasource URL written into every tenant org.
            - name: QUERY_GATEWAY_URL
              value: http://query-gateway:8080

            # Database
            - name: DB_HOST
              value: control-plane-postgres

            - name: DB_PORT
              value: "5432"

            - name: DB_NAME
              valueFrom:
                secretKeyRef:
                  name: control-plane-db
                  key: database

            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: control-plane-db
                  key: username

            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: control-plane-db
                  key: password

          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512M
