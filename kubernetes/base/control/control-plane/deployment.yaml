apiVersion: apps/v1
kind: Deployment
metadata:
  name: control-plane

spec:
  replicas: 1

  selector:
    matchLabels:
      app: control-plane

  template:
    metadata:
      labels:
        app: control-plane

    spec:
      # Schema migrations run here, before the app starts, in file order.
      # schema_migrations records what ran; an advisory lock serializes
      # concurrent pods (rolling update, several replicas). Adding a .sql file
      # changes the ConfigMap hash -> new rollout -> it runs. No Jobs.
      initContainers:
        - name: migrate
          image: postgres:17-alpine

          env:
            - name: PGHOST
              value: control-plane-postgres

            - name: PGDATABASE
              valueFrom:
                secretKeyRef:
                  name: control-plane-db
                  key: database

            - name: PGUSER
              valueFrom:
                secretKeyRef:
                  name: control-plane-db
                  key: username

            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: control-plane-db
                  key: password

          command:
            - /bin/sh
            - -ec
            - |
              until pg_isready -q; do
                echo "Waiting for control-plane-postgres..."
                sleep 2
              done

              SCRIPT=/tmp/migrate.sql
              {
                printf '%s\n' "SELECT pg_advisory_lock(727001);"
                printf '%s\n' "CREATE TABLE IF NOT EXISTS schema_migrations (version TEXT PRIMARY KEY, applied_at TIMESTAMPTZ NOT NULL DEFAULT now());"
                for f in $(ls /migrations/*.sql | sort); do
                  v=$(basename "$f")
                  printf '%s\n' "SELECT NOT EXISTS (SELECT 1 FROM schema_migrations WHERE version = '$v') AS pending \\gset"
                  printf '%s\n' "\\if :pending"
                  printf '%s\n' "\\echo applying $v"
                  printf '%s\n' "\\i $f"
                  printf '%s\n' "INSERT INTO schema_migrations (version) VALUES ('$v');"
                  printf '%s\n' "\\endif"
                done
                printf '%s\n' "SELECT pg_advisory_unlock(727001);"
              } > "$SCRIPT"

              psql -v ON_ERROR_STOP=1 -q -f "$SCRIPT"
              echo "Migrations up to date."

          volumeMounts:
            - name: migrations
              mountPath: /migrations
              readOnly: true

      containers:
        - name: control-plane

          # Replaced by development/production overlay.
          image: control-plane:latest

          ports:
            - name: http
              containerPort: 8080

          # Ready = Nest listens AND its DB answers. A rollout replaces the
          # old pod only after the new one is ready. Keycloak/Grafana are NOT
          # part of readiness (their outages show as 503s and outbox backlog).
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5

          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 20
            periodSeconds: 10
            failureThreshold: 6

          env:
            - name: PORT
              value: "8080"

            # Human JWT verification.
            - name: KEYCLOAK_ISSUER
              value: http://localhost:8080/realms/observability

            - name: KEYCLOAK_JWKS_URI
              value: http://keycloak:8080/realms/observability/protocol/openid-connect/certs

            - name: KEYCLOAK_AUDIENCE
              value: control-plane

            # Control Plane -> Keycloak Admin API.
            - name: KEYCLOAK_URL
              value: http://keycloak:8080

            - name: KEYCLOAK_REALM
              value: observability

            - name: KEYCLOAK_ADMIN_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: control-plane-keycloak
                  key: client_id

            - name: KEYCLOAK_ADMIN_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: control-plane-keycloak
                  key: client_secret

            - name: KEYCLOAK_PUBLIC_URL
              valueFrom:
                configMapKeyRef:
                  name: platform-endpoints
                  key: KEYCLOAK_PUBLIC_URL

            - name: OTEL_GATEWAY_PUBLIC_URL
              valueFrom:
                configMapKeyRef:
                  name: platform-endpoints
                  key: OTEL_GATEWAY_PUBLIC_URL

            # Control Plane -> Grafana HTTP API (one org per tenant).
            - name: GRAFANA_URL
              value: http://grafana:3000

            - name: GRAFANA_ADMIN_USER
              valueFrom:
                secretKeyRef:
                  name: grafana-admin
                  key: username

            - name: GRAFANA_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: grafana-admin
                  key: password

            # Tenant that owns Grafana org 1 (platform admins live here).
            - name: GRAFANA_DEFAULT_TENANT
              value: admin-tenant

            # Datasource URL written into every tenant org.
            - name: QUERY_GATEWAY_URL
              value: http://query-gateway:8080

            # Initial platform admin, created once at startup if the DB has
            # none (PlatformBootstrapService). Optional: without it the
            # platform starts with no human admin.
            - name: PLATFORM_ADMIN_USERNAME
              valueFrom:
                secretKeyRef:
                  name: platform-admin
                  key: username
                  optional: true

            - name: PLATFORM_ADMIN_EMAIL
              valueFrom:
                secretKeyRef:
                  name: platform-admin
                  key: email
                  optional: true

            - name: PLATFORM_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: platform-admin
                  key: password
                  optional: true

            # Database
            - name: DB_HOST
              value: control-plane-postgres

            - name: DB_PORT
              value: "5432"

            - name: DB_NAME
              valueFrom:
                secretKeyRef:
                  name: control-plane-db
                  key: database

            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: control-plane-db
                  key: username

            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: control-plane-db
                  key: password

          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi

      volumes:
        - name: migrations
          configMap:
            name: control-plane-db-migrations
