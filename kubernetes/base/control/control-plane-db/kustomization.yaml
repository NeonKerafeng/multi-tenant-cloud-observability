apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Schema migrations are applied by the control-plane Deployment's
# `migrate` initContainer (ordered, tracked in schema_migrations, advisory
# lock). Add a new NNN_name.sql here; never edit one that a live database
# has already applied.
resources:
  - postgres.yaml

configMapGenerator:
  - name: control-plane-db-migrations
    files:
      - 001_init.sql
      - 002_grafana_org.sql
      - 003_sync.sql
      - 004_support_access.sql
      - 005_identity_mirror.sql
      - 006_agent_enrollments.sql
