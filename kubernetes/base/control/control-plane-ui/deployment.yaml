apiVersion: apps/v1
kind: Deployment
metadata:
  name: control-plane-ui
  labels:
    app: control-plane-ui

spec:
  replicas: 1

  selector:
    matchLabels:
      app: control-plane-ui

  template:
    metadata:
      labels:
        app: control-plane-ui

    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101

      containers:
        - name: nginx
          image: nginxinc/nginx-unprivileged:1.27-alpine

          ports:
            - name: http
              containerPort: 8080

          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5

          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 20

          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]

          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 200m
              memory: 64Mi

          volumeMounts:
            - name: site
              mountPath: /usr/share/nginx/html
              readOnly: true

            - name: nginx
              mountPath: /etc/nginx/conf.d
              readOnly: true

            # pid file and proxy/client temp files of the unprivileged image.
            - name: tmp
              mountPath: /tmp

      volumes:
        # Site files + config.js in one directory (a projected volume, since
        # a subPath file inside a ConfigMap mount is not possible).
        - name: site
          projected:
            sources:
              - configMap:
                  name: control-plane-ui-site
              - configMap:
                  name: control-plane-ui-config

        - name: nginx
          configMap:
            name: control-plane-ui-nginx

        - name: tmp
          emptyDir: {}
