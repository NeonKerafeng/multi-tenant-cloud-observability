apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Control-plane web UI (TODO-01): plain ES modules served by stock nginx,
# no build step and no npm dependencies. ConfigMap names get a content
# hash, so every change of a file rolls the Deployment.

resources:
  - deployment.yaml
  - service.yaml

configMapGenerator:
  - name: control-plane-ui-site
    files:
      - site/index.html
      - site/favicon.svg
      - site/styles.css
      - site/theme.js
      - site/app.js
      - site/api.js
      - site/auth.js
      - site/dom.js
      - site/router.js
      - site/session.js
      - site/ui.js
      - site/screens.js
      - site/page-home.js
      - site/page-tenants.js
      - site/page-tenant.js
      - site/page-support.js
      - site/page-sync.js
      - site/page-profile.js
      - site/tab-users.js
      - site/tab-agents.js
      - site/tab-enrollments.js
      - site/tab-support.js

  # TODO-04 door: the only place the UI knows Keycloak/Grafana/public URLs.
  # An overlay can swap it with `behavior: replace` (no image, no rebuild).
  - name: control-plane-ui-config
    files:
      - config.js

  - name: control-plane-ui-nginx
    files:
      - default.conf=nginx.conf
