# control-plane-ui (TODO-01): static SPA + same-origin API proxy.
# Same origin for /api means the browser never needs CORS on control-plane.
# This file is included inside the http {} block of the stock nginx.conf.

# Revalidate everything (the site is small and changes with every deploy);
# never cache the runtime config.
map $uri $mtco_cache_control {
    /config.js  "no-store";
    default     "no-cache";
}

server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    server_tokens off;

    gzip on;
    gzip_types text/css application/javascript image/svg+xml application/json;

    # No add_header inside the locations below, so these apply everywhere.
    # Scripts and styles only from this origin (no inline code anywhere in
    # the UI); fetch() may reach Keycloak wherever config.js points it.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self' http: https:; frame-ancestors 'none'; base-uri 'none'; form-action 'none'; object-src 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Frame-Options "DENY" always;
    add_header Cache-Control $mtco_cache_control always;

    # Probe endpoint (no file system, no upstream).
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # control-plane API; the path is kept (/api/v1/... -> /api/v1/...).
    location /api/ {
        proxy_pass http://control-plane:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Hash routes (#/tenants/...) need no rewrites; unknown paths get the app.
    location / {
        try_files $uri /index.html;
    }
}
