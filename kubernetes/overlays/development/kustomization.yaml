apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: observability

resources:
  - ../../base/foundation
  - ../../base/storage/victoriametrics
  - ../../base/storage/opensearch
  - ../../base/ingest/otel-gateway
  - ../../base/identity/keycloak
  - ../../base/query
  - ../../base/control/control-plane
  - ../../base/control/control-plane-db

secretGenerator:
  - name: opensearch-bootstrap
    envs:
      - secrets.env

  - name: opensearch-ingest
    envs:
      - opensearch-ingest.env

  - name: opensearch-query
    envs:
      - opensearch-query.env

  - name: keycloak-db
    envs:
      - keycloak-db.env

  - name: keycloak-admin
    envs:
      - keycloak-admin.env

  - name: grafana-admin
    envs:
      - grafana-admin.env

  - name: grafana-oidc
    envs:
      - grafana-oidc.env

  - name: grafana-db
    envs:
      - grafana-db.env

  - name: control-plane-keycloak
    envs:
      - control-plane-keycloak.env

  - name: control-plane-db
    envs:
      - control-plane-db.env

  - name: platform-admin
    envs:
      - platform-admin.env

configMapGenerator:
  - name: platform-endpoints
    envs:
      - platform.env

images:
  - name: query-gateway
    newName: kerafeng/query-gateway
    newTag: v0.1.13

  - name: control-plane
    newName: kerafeng/control-plane
    newTag: v0.6.3

patches:
  - path: patches/keycloak.yaml

  # Volumes of this environment. The Viettel Cloud CSI cannot provision
  # (2026-10-08: "no volume type" for both csi-sc-viettelplugin-hdd and -ssd,
  # cluster-wide), so development uses local-path (install once:
  # kubectl apply -k kubernetes/infra/local-path-provisioner).
  # When the CSI works again, set csi-sc-viettelplugin-ssd/-hdd here.
  # Base manifests stay cloud-neutral.
  - target:
      kind: StatefulSet
    patch: |-
      - op: add
        path: /spec/volumeClaimTemplates/0/spec/storageClassName
        value: local-path
