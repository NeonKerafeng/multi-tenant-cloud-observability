apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: observability

resources:
  - ../../base/foundation
  - ../../base/storage/victoriametrics
  - ../../base/storage/opensearch
  - ../../base/ingest/otel-gateway
  - ../../base/identity/keycloak
  - ../../base/query
  - ../../base/control/control-plane

secretGenerator:
  - name: opensearch-bootstrap
    envs:
      - secrets.env

  - name: opensearch-ingest
    envs:
      - opensearch-ingest.env

  - name: opensearch-query
    envs:
      - opensearch-query.env

  - name: keycloak-db
    envs:
      - keycloak-db.env

  - name: keycloak-admin
    envs:
      - keycloak-admin.env

  - name: grafana-admin
    envs:
      - grafana-admin.env

  - name: grafana-oidc
    envs:
      - grafana-oidc.env

  - name: control-plane-keycloak
    envs:
      - control-plane-keycloak.env

images:
  - name: query-gateway
    newName: kerafeng/query-gateway
    newTag: v0.1.10-e2e

  - name: control-plane
    newName: kerafeng/control-plane
    newTag: v0.1.0

patches:
  - path: patches/keycloak.yaml