receivers:
  host_metrics:
    root_path: /hostfs
    collection_interval: 10s

    scrapers:
      cpu:
      memory:
      load:
      disk:
      filesystem:
      network:

  journald:
    root_path: /hostfs
    journalctl_path: /usr/bin/journalctl
    start_at: end

processors:
  batch:

extensions:
  oauth2client/agent:
    client_id: ${env:OTEL_AGENT_CLIENT_ID}
    client_secret: ${env:OTEL_AGENT_CLIENT_SECRET}
    token_url: ${env:KEYCLOAK_TOKEN_URL}
    expiry_buffer: 10s

exporters:
  otlp_http/gateway:
    endpoint: ${env:OTEL_GATEWAY_ENDPOINT}
    auth:
      authenticator: oauth2client/agent

service:
  extensions:
    - oauth2client/agent

  pipelines:
    metrics:
      receivers: [host_metrics]
      processors: [batch]
      exporters: [otlp_http/gateway]

    logs:
      receivers: [journald]
      processors: [batch]
      exporters: [otlp_http/gateway]
